; EXPERIMENTAL: DIS02050A PCB V1.2/V1.3 only; hardware unverified.
; See docs/crowpanel-advance.md before selecting or flashing this environment.
[env:crowpanel-advance-5-v12-v13_16MB]
extends = arduino_esp32s3_v2, flash_16mb
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi

build_flags =
    ${arduino_esp32s3_v2.build_flags}
    ${esp32s3.ps_ram}
    -D HASP_MODEL="CrowPanel Advance 5 V1.2-V1.3 EXPERIMENTAL"
    -D HASP_CROWPANEL_ADVANCE_STC=1
    ; USB-UART bridge is the console. Native USB uses GPIO19/20 needed by UART1.
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D HASP_LV_USE_SW_ROTATE=0
    -D LGFX_USE_V1=1
    -D RGB_DRIVER=1
    -D TFT_WIDTH=800
    -D TFT_HEIGHT=480
    -D TFT_BCKL=-1
    -D TFT_B0=21
    -D TFT_B1=47
    -D TFT_B2=48
    -D TFT_B3=45
    -D TFT_B4=38
    -D TFT_G0=9
    -D TFT_G1=10
    -D TFT_G2=11
    -D TFT_G3=12
    -D TFT_G4=13
    -D TFT_G5=14
    -D TFT_R0=7
    -D TFT_R1=17
    -D TFT_R2=18
    -D TFT_R3=3
    -D TFT_R4=46
    -D TFT_DE=42
    -D TFT_VSYNC=41
    -D TFT_HSYNC=40
    -D TFT_PCLK=39
    -D TFT_HSYNC_POLARITY=0
    -D TFT_HSYNC_FRONT_PORCH=8
    -D TFT_HSYNC_PULSE_WIDTH=4
    -D TFT_HSYNC_BACK_PORCH=8
    -D TFT_VSYNC_POLARITY=0
    -D TFT_VSYNC_FRONT_PORCH=8
    -D TFT_VSYNC_PULSE_WIDTH=4
    -D TFT_VSYNC_BACK_PORCH=8
    -D TFT_PREFER_SPEED=16000000
    -D TFT_AUTO_FLUSH=1
    -D HASP_USE_LGFX_TOUCH=1
    -D TOUCH_WIDTH=800
    -D TOUCH_HEIGHT=480
    -D TOUCH_DRIVER=0x911
    -D TOUCH_SCL=16
    -D TOUCH_SDA=15
    -D TOUCH_IRQ=-1
    -D TOUCH_RST=-1
    -D TOUCH_OFFSET_ROTATION=0
    -D I2C_TOUCH_PORT=0
    -D I2C_TOUCH_ADDRESS=0x5D
    -D I2C_TOUCH_FREQUENCY=400000

lib_deps =
    ${arduino_esp32s3_v2.lib_deps}
    ${lovyangfx.lib_deps}
    ${goodix.lib_deps}
